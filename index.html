    <script>
      // Filter out benign HMR WebSocket connection logs in preview iframe (HMR disabled in platform runtime)
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          const first = args[0];
          const str = typeof first === 'string' ? first : (first && first.message) || '';
          if (
            str.includes('[vite]') ||
            str.includes('WebSocket') ||
            str.includes('websocket') ||
            str.includes('vite-plugin-pwa')
          ) {
            return;
          }
          origError.apply(console, args);
        };
      })();
    </script>
