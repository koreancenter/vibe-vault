<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Pre-paint season theme hydration (zero FOUC) + early PWA beforeinstallprompt capture
      (function () {
        try {
          var raw = localStorage.getItem('vibe_user_preferences');
          var s = raw ? JSON.parse(raw).seasonTheme : 'winter';
          if (s !== 'spring' && s !== 'summer' && s !== 'autumn' && s !== 'winter') s = 'winter';
          document.documentElement.setAttribute('data-season', s);
        } catch (e) {
          document.documentElement.setAttribute('data-season', 'winter');
        }
      })();
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        if (typeof window.dispatchPWAInstallEvent === 'function') {
          window.dispatchPWAInstallEvent(e);
        }
      });
    </script>
    <title>Vibe Vault</title>
